# Al Umer Mobile - Development Environment
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: alumer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: al_umer_mobile_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alumer_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: alumer_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - alumer_network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alumer_app
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/al_umer_mobile_db
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your-nextauth-secret-key-here
      - JWT_SECRET=your-jwt-secret-key-here
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    networks:
      - alumer_network

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  alumer_network:
    driver: bridge
